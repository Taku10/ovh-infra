---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name:
      - bash-completion
      - ca-certificates
      - curl
      - git
      - jq
      - unzip
    state: present
