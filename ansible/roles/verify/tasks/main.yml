---
- name: Show Kubernetes nodes
  ansible.builtin.command:
    cmd: kubectl get nodes
  become_user: "{{ admin_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: nodes
  changed_when: false

- name: Display nodes
  ansible.builtin.debug:
    var: nodes.stdout_lines

- name: Show all pods
  ansible.builtin.command:
    cmd: kubectl get pods -A
  become_user: "{{ admin_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: pods
  changed_when: false

- name: Display pods
  ansible.builtin.debug:
    var: pods.stdout_lines
